[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "day09-ecommerce-dispute-agents"
version = "1.0.0"
description = "Typed multi-agent pipeline for Olist e-commerce dispute resolution"
requires-python = ">=3.11"
dependencies = [
  "groq>=0.31,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
resolve-disputes = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

